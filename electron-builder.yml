appId: com.chochoi.ccmotioneditor
productName: CC Motion Editor
copyright: "© 2026 Chợ Chời Creative Studio"
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # ffmpeg được chép riêng theo kiến trúc vào Resources/bin (extraResources), không cần gói npm
  - "!node_modules/ffmpeg-static/**"
extraResources:
  - from: build/bin/darwin-${arch}
    to: bin
artifactName: "CC-Motion-Editor-${version}-${arch}.${ext}"
mac:
  icon: build/icon.png
  category: public.app-category.video
  target: dmg
  minimumSystemVersion: "12.0"
  # Chưa có Apple Developer ID: build trên Mac thì ad-hoc sign; build trên Linux dùng scripts/build-mac.sh
  identity: "-"
  hardenedRuntime: false
dmg:
  title: CC Motion Editor
