# Tạm thời: chạy thử phần lấy giá với nguồn mới (không đăng app, không gửi thông báo). Xoá sau khi xác nhận.
name: Giá vàng - kiểm tra nguồn
on:
  push:
    branches: [claude/inspiring-darwin-5jj3ns]
    paths: ['gia-vang/scripts/**', '.github/workflows/gia-vang-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: gia-vang
        run: |
          npm ci --no-audit --no-fund
          node scripts/fetch.mjs
          node -e "const d=require('./web/data/latest.json');console.log('TG',d.world?.usdPerOz,d.world?.changePct);for(const b of d.brands)console.log(b.name,b.status,b.via||'',b.main?.name||'',b.main?.buy||'',b.main?.sell||'',b.main?.at||'',b.error||'');console.log('Phân tích:',d.analysis?.engine,d.analysis?.headline);const h=require('./web/data/history.json');console.log('Lịch sử TG',h.world.length,'ngày')"
